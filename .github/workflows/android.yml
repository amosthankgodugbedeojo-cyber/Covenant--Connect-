name: Build Covenant Connect APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/covenant-source"

          found=0
          while IFS= read -r -d '' archive; do
            if unzip -t "$archive" >/dev/null 2>&1; then
              unzip -oq "$archive" -d "$RUNNER_TEMP/covenant-source"
              found=1
            fi
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -print0)

          if [ "$found" -ne 1 ]; then
            echo "No valid project ZIP found"
            exit 1
          fi

          settings_file=$(find "$RUNNER_TEMP/covenant-source" -type f -name settings.gradle.kts -print -quit)

          if [ -z "$settings_file" ]; then
            echo "Project settings file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$settings_file")

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "Android app module not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Covenant-Connect-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
