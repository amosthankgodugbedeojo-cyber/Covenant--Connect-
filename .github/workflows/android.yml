name: Build Covenant Connect APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager not found at $SDKMANAGER"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-36.1" \
            "build-tools;36.1.0" \
            "platform-tools"

      - name: Extract uploaded project ZIP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/covenant-source"
          found=0

          while IFS= read -r -d '' archive; do
            if unzip -t "$archive" >/dev/null 2>&1; then
              echo "Extracting: $archive"
              unzip -oq "$archive" -d "$RUNNER_TEMP/covenant-source"
              found=1
            fi
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -print0)

          if [ "$found" -ne 1 ]; then
            echo "No valid ZIP archive was found."
            exit 1
          fi

          settings_file=$(find "$RUNNER_TEMP/covenant-source" -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$settings_file" ]; then
            echo "Could not find settings.gradle.kts."
            exit 1
          fi

          project_dir=$(dirname "$settings_file")

          if [ ! -d "$project_dir/app" ]; then
            echo "The expected app module folder was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          apk=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" -print -quit)
          if [ -z "$apk" ]; then
            echo "APK was not generated."
            exit 1
          fi
          cp "$apk" "$GITHUB_WORKSPACE/CovenantConnect-debug.apk"

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Covenant-Connect-APK
          path: CovenantConnect-debug.apk
          
